name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings for a manual approval gate.
    environment: production
    permissions:
      id-token: write # OIDC token for AWS
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Package
        run: |
          pip install -r requirements.txt -t package/
          cp lambda_function.py package/
          cd package && zip -r ../lambda.zip . && cd ..
      - name: Update function code
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda.zip
      - name: Wait for update to finish
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: aws lambda wait function-updated --function-name "$FUNCTION_NAME"
